name: warung-rimbun

services:
  warung-rimbun:
    container_name: warung-rimbun
    image: warung-rimbun:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8880:80"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: "Web UI (8880)"
            id_id: "Web UI (8880)"

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: warung-rimbun
  description:
    en_us: "WARUNG RIMBUN (Wadah Urun Rembuk Perencanaan dan Inovasi Pembangunan)"
    id_id: "WARUNG RIMBUN (Wadah Urun Rembuk Perencanaan dan Inovasi Pembangunan)"
  tag: "Planning & Governance"
  developer: "Bapperida"
  author: "Bapperida"
  icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/government.png"
  thumbnail: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/government.png"
  title:
    en_us: "WARUNG RIMBUN"
    id_id: "WARUNG RIMBUN"
  index: /
  port_map: "8880"
  scheme: http

networks:
  default:
    driver: bridge
